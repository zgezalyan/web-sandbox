name: Docker

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  compose-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build compose images
        run: docker compose build
